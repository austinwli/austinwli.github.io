name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "18"

      - run: npm ci

      # TEMPORARY: no Node toolchain on the dev machine, so Prettier can't be
      # run locally. Format in the runner and print the diff, then remove this.
      - name: Show prettier diff (temporary)
        run: |
          npx prettier --write --plugin-search-dir=. "src/routes/volo/+page.svelte"
          echo "===== PRETTIER DIFF BEGIN ====="
          git --no-pager diff -- src/routes/volo/+page.svelte
          echo "===== PRETTIER DIFF END ====="

      - run: npm run check

      - run: npm run lint

      - run: npm run build

      - uses: JamesIves/github-pages-deploy-action@4.1.8
        with:
          branch: gh-pages
          folder: build
          single-commit: true
